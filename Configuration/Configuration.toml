# CppSentinel v2 configuration
#
# CLI:
#   CppSentinel run --config <this-file> --target <file-or-dir>
#
# Relative paths are resolved against this file's directory.
# Do not use legacy [MethodName] tables or command = """...""" shell templates.
# See docs/configuration.md / docs/configuration.zh-CN.md.

schema_version = 2

[project]
# Project root used for working directories and default -I paths (cppcheck).
root = ".."
# Path to compile_commands.json (file) or a path whose parent is the -p dir.
# Must match a CMake build with CMAKE_EXPORT_COMPILE_COMMANDS=ON.
# Adjust if your build directory is not ../build (e.g. ../build-v2/...).
compilation_database = "../build/compile_commands.json"
# Parent directory for report/<run-id>/ trees.
report_dir = "../report"

[run]
# Parallel checkers are not implemented yet; must remain 1.
max_parallel = 1
# Default per-checker timeout (seconds). Overridable per [[checker]].
timeout_seconds = 120
# When diagnostics cause failure: never|error|warning|style|information
# Hard statuses (start/timeout/tool/config errors) always fail.
fail_on = "warning"

# Always available; used when a checker sets environment = "native".
[environment.native]
kind = "native"
inherit_parent = true

# Windows MSYS2 MinGW64 toolchain (clang-tidy, g++, cppcheck, ...).
[environment.mingw64]
kind = "msys2"
root = "C:/msys64"
msystem = "MINGW64"
inherit_parent = true

# ---------------------------------------------------------------------------
# Built-in checkers (declaration order == execution order)
# id must be unique; it names logs/ and artifacts/ entries.
# ---------------------------------------------------------------------------

[[checker]]
id = "clang-tidy"
kind = "clang-tidy"
enabled = true
environment = "mingw64"
# Requires project.compilation_database. Passes -p <build_dir>.
checks = "clang-diagnostic-*,clang-analyzer-*,bugprone-*,cert-*,performance-*,portability-*,readability-*,modernize-*"
header_filter = ".*"

[[checker]]
id = "clang-format"
kind = "clang-format"
enabled = true
environment = "mingw64"
# Dry-run only; style findings become severity=style diagnostics.
style = "file"

[[checker]]
id = "compiler-diagnostics"
kind = "compiler-diagnostics"
enabled = true
environment = "mingw64"
# Replays compile_commands flags with -fsyntax-only for --target.
compiler = "c++"

[[checker]]
id = "cppcheck"
kind = "cppcheck"
enabled = true
environment = "mingw64"
enable = "warning,style,performance,portability,information"
std = "c++20"
